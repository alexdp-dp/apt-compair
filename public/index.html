<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AptCompare</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div><b>AptCompare</b><span>Comparator apartamente</span></div><button id="scanAll">Scanează toate sursele</button></header>
<main><aside><h3>Filtre</h3><label>Proiect<select id="project"><option value="">Toate</option></select></label><label>Camere<select id="rooms"><option value="">Toate</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>Preț maxim (€)<input id="maxPrice" type="number" placeholder="ex. 180000"></label><label>Suprafață utilă minimă<input id="minArea" type="number" placeholder="ex. 55"></label><label>Status<select id="status"><option value="">Toate</option><option value="available">Disponibil</option><option value="sold">Vândut</option></select></label><button id="reset">Resetează</button><hr><h3>Surse</h3><div id="sources"></div><details><summary>Adaugă sursă</summary><input id="sname" placeholder="Nume"><input id="surl" placeholder="https://..."><button id="addSource">Adaugă</button></details></aside>
<section><div class="toolbar"><div><h1>Compară apartamente</h1><p id="meta">Se încarcă…</p></div><input id="search" placeholder="Caută tip/proiect"></div><div id="notice"></div><div class="tablewrap"><table><thead><tr><th>Proiect</th><th>Tip</th><th>Camere</th><th>Preț</th><th>Utilă</th><th>Totală</th><th>€/mp util</th><th>TVA</th><th>Status</th><th>Finalizare</th><th>Sursă</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="/app.js"></script></body></html>
